syntax = "proto3";
package aiwin11.v1;

message Command {
  uint32 schema_version = 1;
  string request_id = 2;
  string session_id = 3;
  string task_id = 4;
  string correlation_id = 5;
  string authenticated_actor_id = 6;
  int64 deadline_ms = 7;
  string idempotency_key = 8;
  oneof operation {
    LaunchApplication launch_application = 9;
    InspectForeground inspect_foreground = 10;
    CaptureForeground capture_foreground = 11;
    AnalyzeCapture analyze_capture = 12;
    CharacterMapDigit character_map_digit = 13;
    PreviewLocalText preview_local_text = 14;
    CopyLocalText copy_local_text = 15;
    MoveLocalText move_local_text = 16;
    DeleteLocalText delete_local_text = 17;
    ListLocalText list_local_text = 18;
    LocateWindow locate_window = 19;
    InspectWindow inspect_window = 20;
    CaptureWindow capture_window = 21;
    TypeInNotepad type_in_notepad = 22;
    TrashLocalText trash_local_text = 23;
    ListProcesses list_processes = 24;
    GetSystemStatus get_system_status = 25;
    ReadClipboard read_clipboard = 26;
    WriteClipboard write_clipboard = 27;
    ListWindows list_windows = 28;
    ArrangeWindow arrange_window = 29;
    ListServices list_services = 30;
    AdminService admin_service = 31;
    AdminCleanTemp admin_clean_temp = 32;
  }
}

// Captures exactly this window (checked against its process) for a local vision model.
message CaptureWindow {
  uint64 window = 1;
  uint32 process_id = 2;
}

// Types text into the Notepad window of this process, only if its document is empty.
message TypeInNotepad {
  uint32 process_id = 1;
  string text = 2;
}

// Moves one text file of the dedicated folder to AiWin11's own trash folder.
message TrashLocalText {}

message ListLocalText {}

// Read-only snapshot of the processes using the most memory (at most 25).
message ListProcesses { uint32 limit = 1; }

message ProcessList {
  repeated ProcessEntry processes = 1;
  // Number of processes seen, before the limit.
  uint32 total = 2;
}

// Lists visible, unowned application windows (at most 20), except the host's.
message ListWindows { uint32 exclude_process_id = 1; }

message WindowList { repeated WindowInfo windows = 1; }

// Changes the state of exactly this window, if it still belongs to this process.
message ArrangeWindow {
  enum Arrangement {
    ARRANGEMENT_UNSPECIFIED = 0;
    ARRANGEMENT_FOCUS = 1;
    ARRANGEMENT_MINIMIZE = 2;
    ARRANGEMENT_RESTORE = 3;
    ARRANGEMENT_MAXIMIZE = 4;
  }
  uint64 window = 1;
  uint32 process_id = 2;
  Arrangement arrangement = 3;
}

// Reads the clipboard's Unicode text (at most 4000 characters), after the user's approval.
message ReadClipboard {}

// Replaces the clipboard with this text (1 to 2000 characters), after the user's approval.
message WriteClipboard { string text = 1; }

message ClipboardContent {
  string text = 1;
  bool truncated = 2;
  bool has_text = 3;
}

// Read-only snapshot of Windows services: stopped automatic services first, then running ones.
message ListServices { uint32 limit = 1; }

message ServiceList {
  repeated ServiceEntry services = 1;
  uint32 total = 2;
  uint32 running = 3;
  uint32 stopped_automatic = 4;
}

message ServiceEntry {
  enum StartMode {
    START_MODE_UNSPECIFIED = 0;
    START_MODE_AUTOMATIC = 1;
    START_MODE_MANUAL = 2;
    START_MODE_DISABLED = 3;
    START_MODE_OTHER = 4;
  }
  // Service key name, at most 64 characters.
  string name = 1;
  // Display name, at most 120 characters.
  string display_name = 2;
  bool running = 3;
  StartMode start_mode = 4;
}

// Administrator operations, run by the on-demand elevated helper (never by the bridge).
message AdminService {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_START = 1;
    ACTION_STOP = 2;
    ACTION_RESTART = 3;
    ACTION_SET_AUTOMATIC = 4;
    ACTION_SET_MANUAL = 5;
    ACTION_SET_DISABLED = 6;
  }
  string service = 1;
  Action action = 2;
}

// Deletes files older than one day in %SystemRoot%\Temp.
message AdminCleanTemp {}

// Read-only system metrics: memory, processor load, uptime, fixed drives.
message GetSystemStatus {}

message SystemStatus {
  uint64 memory_total_bytes = 1;
  uint64 memory_available_bytes = 2;
  // Processor load sampled over 250 ms, 0 to 100.
  uint32 cpu_load_percent = 3;
  uint32 logical_processors = 4;
  uint64 uptime_seconds = 5;
  // Fixed drives, at most 8.
  repeated DriveStatus drives = 6;
}

message DriveStatus {
  // Root such as "C:\", at most 8 characters.
  string name = 1;
  uint64 total_bytes = 2;
  uint64 free_bytes = 3;
}

message ProcessEntry {
  uint32 process_id = 1;
  // Executable name without extension, at most 64 characters.
  string name = 2;
  uint64 working_set_bytes = 3;
  uint64 cpu_time_ms = 4;
  bool has_window = 5;
}

// Finds the topmost visible, unowned application window that the given process
// (the trusted host) does not own: the window the user was using before AiWin11.
message LocateWindow { uint32 exclude_process_id = 1; }

// Reads the UI Automation tree of exactly this window, if it still belongs to this process.
message InspectWindow {
  uint64 window = 1;
  uint32 process_id = 2;
}

message WindowInfo {
  uint64 window = 1;
  uint32 process_id = 2;
  string title = 3;
  string process_name = 4;
  // Filled by ListWindows only.
  bool minimized = 5;
}

message InspectForeground {}
message CaptureForeground {}
message AnalyzeCapture {}
message PreviewLocalText {}
message CopyLocalText {}
message MoveLocalText {}
message DeleteLocalText { bool confirmed = 1; }
message CharacterMapDigit {
  optional uint32 digit = 1;
}

message WindowCapture {
  bytes jpeg = 1;
  uint32 width = 2;
  uint32 height = 3;
}

message UiTree {
  repeated UiNode nodes = 1;
  bool truncated = 2;
}

message UiNode {
  uint32 parent = 1;
  uint32 control_type = 2;
  bool enabled = 3;
  bool focused = 4;
  // Accessible name, at most 80 characters. Always empty for password fields.
  // Filled only for InspectWindow; the foreground inspector returns structure only.
  string name = 5;
}

message LaunchApplication {
  enum Application {
    APPLICATION_UNSPECIFIED = 0;
    APPLICATION_NOTEPAD = 1;
    APPLICATION_CHARACTER_MAP = 2;
    APPLICATION_PAINT = 3;
  }
  Application application = 1;
}

message Result {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SUCCESS = 1;
    STATUS_PARTIAL = 2;
    STATUS_FAILED = 3;
    STATUS_DENIED = 4;
    STATUS_CANCELLED = 5;
    STATUS_TIMEOUT = 6;
  }
  uint32 schema_version = 1;
  string request_id = 2;
  Status status = 3;
  Error error = 4;
  uint64 duration_ms = 5;
  optional uint32 process_id = 6;
  UiTree ui_tree = 7;
  WindowCapture window_capture = 8;
  WindowInfo window_info = 9;
  ProcessList process_list = 10;
  SystemStatus system_status = 11;
  ClipboardContent clipboard_content = 12;
  WindowList window_list = 13;
  ServiceList service_list = 14;
}

message Error {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message Event {
  uint32 schema_version = 1;
  string id = 2;
  uint64 sequence = 3;
  string timestamp_utc = 4;
  string session_id = 5;
  string task_id = 6;
  string type = 7;
  string source = 8;
  string correlation_id = 9;
  oneof payload {
    PolicyDecision policy_decision = 10;
    Result execution_result = 11;
  }
}

message PolicyDecision {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_ALLOW = 1;
    OUTCOME_DENY = 2;
    OUTCOME_ASK = 3;
    OUTCOME_SIMULATE = 4;
  }
  Outcome outcome = 1;
  string code = 2;
}
