syntax = "proto3";
package aiwin11.v1;

message Command {
  uint32 schema_version = 1;
  string request_id = 2;
  string session_id = 3;
  string task_id = 4;
  string correlation_id = 5;
  string authenticated_actor_id = 6;
  int64 deadline_ms = 7;
  string idempotency_key = 8;
  oneof operation {
    LaunchApplication launch_application = 9;
    InspectForeground inspect_foreground = 10;
    CaptureForeground capture_foreground = 11;
    AnalyzeCapture analyze_capture = 12;
    CharacterMapDigit character_map_digit = 13;
    PreviewLocalText preview_local_text = 14;
    CopyLocalText copy_local_text = 15;
    MoveLocalText move_local_text = 16;
    DeleteLocalText delete_local_text = 17;
    ListLocalText list_local_text = 18;
    LocateWindow locate_window = 19;
    InspectWindow inspect_window = 20;
    CaptureWindow capture_window = 21;
    TypeInNotepad type_in_notepad = 22;
    TrashLocalText trash_local_text = 23;
    ListProcesses list_processes = 24;
  }
}

// Captures exactly this window (checked against its process) for a local vision model.
message CaptureWindow {
  uint64 window = 1;
  uint32 process_id = 2;
}

// Types text into the Notepad window of this process, only if its document is empty.
message TypeInNotepad {
  uint32 process_id = 1;
  string text = 2;
}

// Moves one text file of the dedicated folder to AiWin11's own trash folder.
message TrashLocalText {}

message ListLocalText {}

// Read-only snapshot of the processes using the most memory (at most 25).
message ListProcesses { uint32 limit = 1; }

message ProcessList {
  repeated ProcessEntry processes = 1;
  // Number of processes seen, before the limit.
  uint32 total = 2;
}

message ProcessEntry {
  uint32 process_id = 1;
  // Executable name without extension, at most 64 characters.
  string name = 2;
  uint64 working_set_bytes = 3;
  uint64 cpu_time_ms = 4;
  bool has_window = 5;
}

// Finds the topmost visible, unowned application window that the given process
// (the trusted host) does not own: the window the user was using before AiWin11.
message LocateWindow { uint32 exclude_process_id = 1; }

// Reads the UI Automation tree of exactly this window, if it still belongs to this process.
message InspectWindow {
  uint64 window = 1;
  uint32 process_id = 2;
}

message WindowInfo {
  uint64 window = 1;
  uint32 process_id = 2;
  string title = 3;
  string process_name = 4;
}

message InspectForeground {}
message CaptureForeground {}
message AnalyzeCapture {}
message PreviewLocalText {}
message CopyLocalText {}
message MoveLocalText {}
message DeleteLocalText { bool confirmed = 1; }
message CharacterMapDigit {
  optional uint32 digit = 1;
}

message WindowCapture {
  bytes jpeg = 1;
  uint32 width = 2;
  uint32 height = 3;
}

message UiTree {
  repeated UiNode nodes = 1;
  bool truncated = 2;
}

message UiNode {
  uint32 parent = 1;
  uint32 control_type = 2;
  bool enabled = 3;
  bool focused = 4;
  // Accessible name, at most 80 characters. Always empty for password fields.
  // Filled only for InspectWindow; the foreground inspector returns structure only.
  string name = 5;
}

message LaunchApplication {
  enum Application {
    APPLICATION_UNSPECIFIED = 0;
    APPLICATION_NOTEPAD = 1;
  }
  Application application = 1;
}

message Result {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SUCCESS = 1;
    STATUS_PARTIAL = 2;
    STATUS_FAILED = 3;
    STATUS_DENIED = 4;
    STATUS_CANCELLED = 5;
    STATUS_TIMEOUT = 6;
  }
  uint32 schema_version = 1;
  string request_id = 2;
  Status status = 3;
  Error error = 4;
  uint64 duration_ms = 5;
  optional uint32 process_id = 6;
  UiTree ui_tree = 7;
  WindowCapture window_capture = 8;
  WindowInfo window_info = 9;
  ProcessList process_list = 10;
}

message Error {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message Event {
  uint32 schema_version = 1;
  string id = 2;
  uint64 sequence = 3;
  string timestamp_utc = 4;
  string session_id = 5;
  string task_id = 6;
  string type = 7;
  string source = 8;
  string correlation_id = 9;
  oneof payload {
    PolicyDecision policy_decision = 10;
    Result execution_result = 11;
  }
}

message PolicyDecision {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_ALLOW = 1;
    OUTCOME_DENY = 2;
    OUTCOME_ASK = 3;
    OUTCOME_SIMULATE = 4;
  }
  Outcome outcome = 1;
  string code = 2;
}
