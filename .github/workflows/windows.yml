name: Windows build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B services/agent/test_agent.py
      - run: dotnet build services/windows/AiWin11.Windows.csproj --configuration Release
      - run: rustup show
      - run: npm --prefix apps/desktop ci --no-audit --no-fund
      - run: npm --prefix apps/desktop run build
      - run: cargo test --locked -p aiwin11-core
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: npm --prefix apps/desktop run tauri -- build --no-bundle
