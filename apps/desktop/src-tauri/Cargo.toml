[package]
name = "aiwin11-desktop"
version = "0.1.0"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.5.3", features = [] }

[dependencies]
aiwin11-core = { path = "../../../services/core" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tauri = { version = "=2.9.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.3.1"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-updater = { version = "=2.9.0", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
aiwin11-model-ipc = { path = "../../../services/model-ipc" }
